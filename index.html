<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ラブクラフト診断レコメンド</title>
  <style>
    #lf-widget-root {
      --bg-1: #010406;
      --bg-2: #071318;
      --panel: rgba(7, 16, 18, 0.94);
      --panel-strong: rgba(12, 23, 26, 0.9);
      --ink: #e2dbc8;
      --muted: #98a39b;
      --accent: #b59a62;
      --accent-2: #6e948d;
      --accent-3: #6b2b28;
      --line: rgba(181, 154, 98, 0.34);
      --line-strong: rgba(205, 185, 132, 0.62);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.52);
      margin: 0;
      min-height: 100vh;
      font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(96, 143, 134, 0.18), transparent 24%),
        radial-gradient(circle at 84% 12%, rgba(140, 112, 62, 0.16), transparent 22%),
        radial-gradient(circle at 50% 115%, rgba(8, 60, 65, 0.52), transparent 36%),
        linear-gradient(180deg, var(--bg-1) 0%, #041015 34%, var(--bg-2) 100%);
      line-height: 1.7;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    #lf-widget-root,
    #lf-widget-root * {
      box-sizing: border-box;
    }

    #lf-widget-root::before,
    #lf-widget-root::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #lf-widget-root::before {
      background:
        repeating-linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.02) 0,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 9px
        );
      opacity: 0.18;
    }

    #lf-widget-root::after {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 34%);
      opacity: 0.3;
    }

    #lf-widget-root .app {
      max-width: 980px;
      margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(7, 16, 19, 0.94), rgba(5, 12, 15, 0.98)),
        radial-gradient(circle at top, rgba(110, 148, 141, 0.1), transparent 34%);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise 0.8s ease;
      position: relative;
      isolation: isolate;
      backdrop-filter: blur(4px);
    }

    #lf-widget-root .app::before,
    #lf-widget-root .app::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    #lf-widget-root .app::before {
      inset: 14px;
      border: 1px solid rgba(205, 185, 132, 0.16);
      border-radius: 18px;
    }

    #lf-widget-root .app::after {
      inset: 0;
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.24) 100%);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #lf-widget-root .lfw-header {
      padding: 34px 30px 22px;
      background:
        linear-gradient(180deg, rgba(15, 30, 35, 0.96), rgba(8, 17, 20, 0.92)),
        radial-gradient(circle at 16% 0%, rgba(110, 148, 141, 0.18), transparent 28%);
      color: #f4ecda;
      border-bottom: 1px solid rgba(205, 185, 132, 0.24);
      position: static !important;
      inset: auto !important;
      transform: none !important;
      z-index: auto !important;
      display: block !important;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    #lf-widget-root .lfw-header::after {
      content: "";
      display: block;
      height: 1px;
      margin-top: 18px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(205, 185, 132, 0.78) 18%,
        rgba(110, 148, 141, 0.4) 50%,
        rgba(205, 185, 132, 0.78) 82%,
        transparent
      );
    }

    #lf-widget-root .lfw-header h1 {
      margin: 0 0 6px;
      font-size: clamp(1.7rem, 1.1rem + 2.2vw, 2.45rem);
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #ece3cb;
      text-shadow: 0 0 18px rgba(110, 148, 141, 0.16);
    }

    #lf-widget-root .lfw-header p {
      margin: 0;
      color: rgba(212, 208, 193, 0.82);
      font-size: 0.96rem;
      max-width: 44rem;
    }

    #lf-widget-root .lfw-content {
      padding: 28px;
      position: static !important;
      margin-top: 0 !important;
      display: block !important;
    }

    #lf-widget-root .question {
      padding: 18px 18px 16px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(16, 29, 32, 0.82), rgba(10, 19, 21, 0.94));
      transform: translateY(6px);
      opacity: 0;
      animation: staggerIn 0.55s ease forwards;
      position: relative;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 14px 26px rgba(0, 0, 0, 0.22);
    }

    #lf-widget-root .question::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(110, 148, 141, 0.8), rgba(181, 154, 98, 0.16));
    }

    #lf-widget-root .question:nth-child(1) { animation-delay: 0.03s; }
    #lf-widget-root .question:nth-child(2) { animation-delay: 0.05s; }
    #lf-widget-root .question:nth-child(3) { animation-delay: 0.07s; }
    #lf-widget-root .question:nth-child(4) { animation-delay: 0.09s; }
    #lf-widget-root .question:nth-child(5) { animation-delay: 0.11s; }
    #lf-widget-root .question:nth-child(6) { animation-delay: 0.13s; }
    #lf-widget-root .question:nth-child(7) { animation-delay: 0.15s; }
    #lf-widget-root .question:nth-child(8) { animation-delay: 0.17s; }
    #lf-widget-root .question:nth-child(9) { animation-delay: 0.19s; }
    #lf-widget-root .question:nth-child(10) { animation-delay: 0.21s; }
    #lf-widget-root .question:nth-child(11) { animation-delay: 0.23s; }
    #lf-widget-root .question:nth-child(12) { animation-delay: 0.25s; }

    @keyframes staggerIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #lf-widget-root .q-title {
      margin: 0 0 12px 12px;
      font-size: 1.02rem;
      font-weight: 700;
      color: #eadfbd;
      letter-spacing: 0.04em;
    }

    #lf-widget-root .options {
      display: grid;
      gap: 10px;
    }

    #lf-widget-root .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.96rem;
      padding: 11px 12px;
      border: 1px solid rgba(181, 154, 98, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.015);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
    }

    #lf-widget-root .option:hover {
      transform: translateX(2px);
      border-color: rgba(205, 185, 132, 0.34);
      background: rgba(110, 148, 141, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
    }

    #lf-widget-root .option:has(input:checked) {
      border-color: rgba(205, 185, 132, 0.64);
      background: linear-gradient(90deg, rgba(110, 148, 141, 0.2), rgba(181, 154, 98, 0.08));
      box-shadow: 0 0 0 1px rgba(205, 185, 132, 0.14);
    }

    #lf-widget-root .option input {
      margin-top: 0.35em;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    #lf-widget-root .option span {
      display: block;
    }

    #lf-widget-root .optional {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed rgba(205, 185, 132, 0.42);
      background: linear-gradient(180deg, rgba(17, 29, 31, 0.74), rgba(10, 19, 21, 0.92));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    #lf-widget-root .optional h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #eadfbd;
    }

    #lf-widget-root textarea {
      width: 100%;
      min-height: 86px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(205, 185, 132, 0.34);
      font: inherit;
      background: rgba(4, 10, 12, 0.84);
      color: var(--ink);
    }

    #lf-widget-root .select-wrap {
      margin-top: 10px;
      display: grid;
      gap: 6px;
    }

    #lf-widget-root select {
      max-width: 420px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(205, 185, 132, 0.34);
      font: inherit;
      background: rgba(4, 10, 12, 0.84);
      color: var(--ink);
    }

    #lf-widget-root .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #lf-widget-root .button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 11px 20px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
    }

    #lf-widget-root .button:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    #lf-widget-root .button.primary {
      background: linear-gradient(135deg, #c7ab6b, #7d6636 70%, #5a4823);
      border-color: rgba(255, 244, 210, 0.12);
      color: #13110b;
    }

    #lf-widget-root .button.secondary {
      background: rgba(12, 22, 25, 0.88);
      color: var(--ink);
      border-color: rgba(205, 185, 132, 0.28);
    }

    #lf-widget-root .error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(153, 71, 65, 0.6);
      background: rgba(72, 21, 19, 0.74);
      color: #f1cbc5;
      display: none;
      font-size: 0.95rem;
    }

    #lf-widget-root .contact {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    #lf-widget-root .contact a {
      color: #d8cfb6;
    }

    #lf-widget-root .share-panel {
      margin: 0 0 18px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(205, 185, 132, 0.3);
      background: linear-gradient(180deg, rgba(18, 30, 34, 0.92), rgba(10, 18, 21, 0.95));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    #lf-widget-root .share-summary {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 0.93rem;
    }

    #lf-widget-root .share-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #lf-widget-root .button.share-x {
      background: #111315;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.08);
    }

    #lf-widget-root .button.share-line {
      background: #06c755;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.08);
    }

    #lf-widget-root .button.share-threads {
      background: rgba(12, 22, 25, 0.88);
      color: var(--ink);
      border-color: rgba(205, 185, 132, 0.28);
    }

    #lf-widget-root .results {
      margin-top: 26px;
      display: none;
      animation: rise 0.65s ease;
    }

    #lf-widget-root .results h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    #lf-widget-root .results p.lead {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #lf-widget-root .section {
      margin-top: 16px;
    }

    #lf-widget-root .section h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      color: #e8dec5;
      letter-spacing: 0.04em;
    }

    #lf-widget-root .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }

    #lf-widget-root .card {
      background: linear-gradient(180deg, rgba(16, 28, 31, 0.92), rgba(9, 18, 21, 0.96));
      border: 1px solid rgba(205, 185, 132, 0.26);
      border-radius: 16px;
      padding: 16px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        0 14px 24px rgba(0, 0, 0, 0.16);
    }

    #lf-widget-root .card h4 {
      margin: 0 0 6px;
      font-size: 1.08rem;
      color: #ece2c8;
    }

    #lf-widget-root .meta {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #lf-widget-root .match {
      margin: 0 0 8px;
      padding-left: 1.1em;
      font-size: 0.92rem;
    }

    #lf-widget-root .disclaimer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 640px) {
      #lf-widget-root {
        padding: 12px;
      }

      #lf-widget-root .lfw-content {
        padding: 16px;
      }

      #lf-widget-root .question {
        padding: 12px;
      }

      #lf-widget-root .lfw-header {
        padding: 24px 18px 16px;
      }
    }
  </style>
</head>
<body style="margin: 0;">
  <div id="lf-widget-root">
  <div class="app" id="app">
    <div class="lfw-header">
      <h1>ラブクラフト作品診断</h1>
      <p>12問＋任意1問で、あなた向けの作品を「本命・次点・冒険枠」で提案します。</p>
    </div>

    <div class="lfw-content">
      <form id="quiz-form">
        <div id="question-list"></div>

        <section class="optional">
          <div class="select-wrap">
            <label for="q13Difficulty"><strong>追加質問（任意）:</strong> 文章の難易度の好みは？</label>
            <select id="q13Difficulty">
              <option value="3" selected>3: どちらでも</option>
              <option value="1">1: 平易でテンポ重視</option>
              <option value="2">2: やや平易な方が良い</option>
              <option value="4">4: 古風でもOK</option>
              <option value="5">5: 古風・詩的でも歓迎</option>
            </select>
          </div>
        </section>

        <div class="actions">
          <button type="submit" class="button primary">診断する</button>
          <button type="button" class="button secondary" id="resetBtn">回答をリセット</button>
        </div>

        <div class="error" id="errorBox"></div>
        <p class="contact">ツールに関するお問い合わせ: <a href="https://word-tailor.com/" target="_blank" rel="noopener noreferrer">https://word-tailor.com/</a></p>
      </form>

      <section class="results" id="results"></section>
    </div>
  </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        id: "q1",
        title: "1) 読後に求める気分は？",
        options: [
          "1: ほっとする／きれいに終わる",
          "2: 少し不穏が残る",
          "3: ほどよく重い",
          "4: かなり暗い・救いが薄い",
          "5: 立ち直りに時間がかかるレベルの重さ"
        ]
      },
      {
        id: "q2",
        title: "2) 気持ち悪さ／嫌悪感をどれくらい許容できる？",
        options: [
          "1: できれば避けたい",
          "2: 少しならOK",
          "3: 中程度ならOK",
          "4: かなりOK",
          "5: どぎつくてもOK"
        ]
      },
      {
        id: "q3",
        title: "3) 好みは『わかる怖さ』か『わからない怖さ』か？",
        options: [
          "1: 正体がはっきりしている怖さが好き",
          "2: どちらかというと前者",
          "3: 半々",
          "4: どちらかというと後者",
          "5: 理解不能・説明不能の怖さが好き"
        ]
      },
      {
        id: "q4",
        title: "4) すぐ怖い vs じわじわ怖い",
        options: [
          "1: すぐ事件が起きてほしい",
          "2: 早めに動いてほしい",
          "3: どちらでも",
          "4: じわじわ積み上げが好き",
          "5: 終盤で一気に来るタイプが好き"
        ]
      },
      {
        id: "q5",
        title: "5) 雰囲気は夢っぽい／幻想 vs 現実っぽい／生活感",
        options: [
          "1: 現実っぽい方が好き",
          "2: どちらかというと現実",
          "3: 半々",
          "4: どちらかというと夢・幻想",
          "5: 夢の中みたいな不確かさが好き"
        ]
      },
      {
        id: "q6",
        title: "6) 舞台の好み：どこに惹かれる？",
        options: [
          "1: 海・港・船／深淵",
          "2: 田舎・寒村・屋敷",
          "3: 都市・路地・地下",
          "4: 遺跡・古代文明・異国",
          "5: 極地・探検・未知の大地"
        ]
      },
      {
        id: "q7",
        title: "7) 伝承・儀式・古いしきたりの要素はどれくらい欲しい？",
        options: [
          "1: ほぼ不要",
          "2: 少しなら",
          "3: 中くらい",
          "4: かなり欲しい",
          "5: 儀式・禁忌が核だと嬉しい"
        ]
      },
      {
        id: "q8",
        title: "8) 学術っぽさ／資料っぽさはどれくらい好き？",
        options: [
          "1: 苦手（物語として読ませてほしい）",
          "2: 少しならOK",
          "3: どちらでも",
          "4: わりと好き",
          "5: 大好物（断片をつなぐのが楽しい）"
        ]
      },
      {
        id: "q9",
        title: "9) 主人公の立ち位置はどれが好み？",
        options: [
          "1: 一般人が巻き込まれる話",
          "2: どちらかというと一般人",
          "3: 半々",
          "4: 研究者／好奇心の調査者",
          "5: 知ろうとして踏み込む人が好き"
        ]
      },
      {
        id: "q10",
        title: "10) 世界観の広がり vs 一本の怖い話",
        options: [
          "1: 一本勝負（短く強い）",
          "2: どちらかというと一本勝負",
          "3: 半々",
          "4: 世界観の広がりも欲しい",
          "5: 神話・歴史・つながりが濃いほど良い"
        ]
      },
      {
        id: "q11",
        title: "11) 長さの許容（読む体力）",
        options: [
          "1: 断章・超短い話がいい",
          "2: 短編がいい",
          "3: 中編までなら",
          "4: 長編でもOK",
          "5: 長編歓迎"
        ]
      },
      {
        id: "q12",
        title: "12) 最後に残したいものは？",
        options: [
          "1: オチの気持ちよさ／スッキリ",
          "2: どちらかというとスッキリ",
          "3: 半々",
          "4: 余韻の不穏さ",
          "5: 読後も頭から離れない余韻"
        ]
      }
    ];

    const TYPE_KEYS = [
      "宇宙",
      "狂気",
      "不条理",
      "禁術",
      "怪奇現象",
      "異形種族",
      "サバイバル",
      "フォークロア",
      "異教",
      "歴史",
      "幻想",
      "タブー"
    ];

    const LENGTH_MAP = {
      "断章": 0.0,
      "短編": 0.33,
      "中編": 0.66,
      "長編": 1.0
    };

    const SHARE_QUERY_VERSION = "1";
    const DEFAULT_DIFFICULTY = 3;

    const STAGE_TAGS = {
      1: ["海", "深淵", "港", "船"],
      2: ["田舎", "寒村", "屋敷", "家系", "血", "食人", "真実", "呪い"],
      3: ["都市", "路地", "地下", "都市史", "幽霊", "禁術", "芸術"],
      4: ["遺跡", "古代遺跡", "古代文明", "歴史", "異国", "古代儀式", "異教"],
      5: ["極地", "探検", "未知", "未知の大地", "古代文明", "サバイバル"]
    };

    const RAW_WORKS = [
      {
        title: "ダゴン",
        tone: { despair: 4, discomfort: 3, afterglow: 3 },
        difficulty: 4,
        length: "短編",
        realism: 1,
        types: { 宇宙: 1, 狂気: 2, 異形種族: 3 },
        motifs: ["海", "深淵"],
        url: "https://amzn.to/3P0NOkF"
      },
      {
        title: "ランドルフ・カーターの供述",
        tone: { despair: 2, discomfort: 2, afterglow: 3 },
        difficulty: 5,
        length: "短編",

    function normalize01From5(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return 0.5;
      const clamped = Math.min(5, Math.max(1, n));
      return (clamped - 1) / 4;
    }

    function lengthTo01(lengthLabel) {
      return LENGTH_MAP[lengthLabel] ?? 0.33;
    }

    function preprocessWork(work) {
      const normalizedTypes = {};
      TYPE_KEYS.forEach((type) => {
        const raw = Number(work.types[type] || 0);
        normalizedTypes[type] = Math.max(0, Math.min(1, raw / 3));
      });

      return {
        ...work,
        D: normalize01From5(work.tone.despair),
        U: normalize01From5(work.tone.discomfort),
        A: normalize01From5(work.tone.afterglow),
        R: normalize01From5(work.difficulty),
        S: Math.max(0, Math.min(1, (Number(work.realism) - 1) / 2)),
        L: lengthTo01(work.length),
        typeVector: normalizedTypes
      };
    }

    const WORKS = RAW_WORKS.map(preprocessWork);

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function cosineSimilarity(vectorA, vectorB) {
      let dot = 0;
      let normA = 0;
      let normB = 0;

      TYPE_KEYS.forEach((key) => {
        const a = vectorA[key] || 0;
        const b = vectorB[key] || 0;
        dot += a * b;
        normA += a * a;
        normB += b * b;
      });

      if (!normA || !normB) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function weightedMean(pairs) {
      let sum = 0;
      let totalWeight = 0;
      pairs.forEach(([value, weight]) => {
        sum += value * weight;
        totalWeight += weight;
      });
      return totalWeight ? sum / totalWeight : 0;
    }

    function buildAnswerKey(answers) {
      return Array.from({ length: 12 }, (_, index) => String(answers[`q${index + 1}`] || "")).join("");
    }

    function buildResultUrl(answers) {
      const url = new URL(window.location.href);
      const hashParams = new URLSearchParams();
      url.hash = "";
      url.search = "";
      hashParams.set("v", SHARE_QUERY_VERSION);
      hashParams.set("a", buildAnswerKey(answers));
      hashParams.set("d", String(answers.q13Difficulty || DEFAULT_DIFFICULTY));
      url.hash = hashParams.toString();
      return url.toString();
    }

    function parseAnswersFromUrl() {
      try {
        const url = new URL(window.location.href);
        const hashParams = new URLSearchParams(url.hash.replace(/^#/, ""));
        const answerKey = hashParams.get("a");
        if (!answerKey || !/^[1-5]{12}$/.test(answerKey)) return null;

        const difficulty = hashParams.get("d") || String(DEFAULT_DIFFICULTY);
        if (!/^[1-5]$/.test(difficulty)) return null;

        const answers = {};
        answerKey.split("").forEach((value, index) => {
          answers[`q${index + 1}`] = Number(value);
        });
        answers.q13Difficulty = Number(difficulty);
        return answers;
      } catch (error) {
        return null;
      }
    }

    function applyAnswersToForm(answers) {
      for (let i = 1; i <= 12; i += 1) {
        const input = document.querySelector(`input[name="q${i}"][value="${answers[`q${i}`]}"]`);
        if (input) input.checked = true;
      }

      const difficultySelect = document.getElementById("q13Difficulty");
      if (difficultySelect) {
        difficultySelect.value = String(answers.q13Difficulty || DEFAULT_DIFFICULTY);
      }
    }

    function replaceUrlSilently(nextUrl) {
      try {
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, "", nextUrl);
        }
      } catch (error) {
        // Ignore environments that disallow history updates.
      }
    }

    function clearResultUrl() {
      const cleanUrl = new URL(window.location.href);
      cleanUrl.hash = "";
      replaceUrlSilently(cleanUrl.toString());
    }

    function buildShareText(primaryPick) {
      return `ラブクラフト作品診断の本命は「${primaryPick.work.title}」でした。あなたも試してみてください。`;
    }

    function buildShareLinks(primaryPick, shareUrl) {
      const shareText = buildShareText(primaryPick);
      return {
        shareText,
        x: `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`,
        line: `https://line.me/R/share?text=${encodeURIComponent(`${shareText}\n${shareUrl}`)}`,
        // Threads does not publish an official share intent doc, so this uses the current public web intent endpoint.
        threads: `https://www.threads.net/intent/post?text=${encodeURIComponent(`${shareText}\n${shareUrl}`)}`
      };
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        // Fall through to the legacy copy path.
      }

      try {
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.setAttribute("readonly", "");
        temp.style.position = "absolute";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.select();
        const copied = document.execCommand("copy");
        document.body.removeChild(temp);
        return copied;
      } catch (error) {
        return false;
      }
    }

    function collectAnswers() {
      const answers = {};
      for (let i = 1; i <= 12; i += 1) {
        const input = document.querySelector(`input[name="q${i}"]:checked`);
        if (!input) {
          return { error: `${i}番の質問に回答してください。` };
        }
        answers[`q${i}`] = Number(input.value);
      }

      answers.q13Difficulty = Number(document.getElementById("q13Difficulty").value || 3);
      return { answers };
    }

    function zeroTypeVector() {
      return TYPE_KEYS.reduce((acc, key) => {
        acc[key] = 0;
        return acc;
      }, {});
    }

    function buildUserProfile(answers) {
      const x1 = normalize01From5(answers.q1);
      const x2 = normalize01From5(answers.q2);
      const x3 = normalize01From5(answers.q3);
      const x4 = normalize01From5(answers.q4);
      const x5 = normalize01From5(answers.q5);
      const x6 = Number(answers.q6);
      const x7 = normalize01From5(answers.q7);
      const x8 = normalize01From5(answers.q8);
      const x9 = normalize01From5(answers.q9);
      const x10 = normalize01From5(answers.q10);
      const x11 = normalize01From5(answers.q11);
      const x12 = normalize01From5(answers.q12);
      const xR = normalize01From5(answers.q13Difficulty);

      const typeVector = zeroTypeVector();

      typeVector["宇宙"] = clamp01(x3 + x10 * 0.35 + (x6 === 1 ? 0.1 : 0));
      typeVector["不条理"] = clamp01(x3 * 0.85 + x5 * 0.2);
      typeVector["狂気"] = clamp01(x3 * 0.7 + x9 * 0.2 + x10 * 0.1);
      typeVector["禁術"] = clamp01(x3 * 0.6 + x7 * 0.2 + x9 * 0.35 + (x6 === 3 ? 0.1 : 0));
      typeVector["怪奇現象"] = clamp01(x3 * 0.45 + (1 - x4) * 0.45 + (x6 === 2 ? 0.12 : 0));
      typeVector["異形種族"] = clamp01(x3 * 0.3 + x10 * 0.25 + (x6 === 5 ? 0.15 : 0));
      typeVector["サバイバル"] = clamp01((1 - x3) * 0.45 + (1 - x4) * 0.42 + (x6 === 5 ? 0.18 : 0));
      typeVector["フォークロア"] = clamp01((1 - x3) * 0.35 + x7 * 0.5 + (x6 === 2 ? 0.15 : 0));
      typeVector["異教"] = clamp01(x7 * 0.72 + (x6 === 4 ? 0.15 : 0));
      typeVector["歴史"] = clamp01(x7 * 0.38 + x8 * 0.6 + x9 * 0.3 + x10 * 0.45 + (x6 === 4 ? 0.1 : 0));
      typeVector["幻想"] = clamp01(x5 * 0.8 + x4 * 0.15 + (x6 >= 4 ? 0.1 : 0));
      typeVector["タブー"] = clamp01(x2 * 0.55 + x7 * 0.15 + (x6 === 2 ? 0.08 : 0));

      const targetD = clamp01(x1 * 0.65 + (x12 * 0.6) * 0.35);
      const targetA = clamp01(x1 * 0.4 + x12 * 0.6);

      const profile = {
        x2,
        x4,
        x5,
        x7,
        x8,
        x9,
        x10,
        stageChoice: x6,
        targetD,
        targetU: x2,
        toleranceU: x2,
        targetA,
        targetS: x5,
        targetL: clamp01(x4 * 0.45 + x11 * 0.55),
        toleranceL: x11,
        targetR: xR,
        toleranceR: xR,
        typeVector
      };

      return profile;
    }

    function buildExpectedTags(profile) {
      const tags = new Set(STAGE_TAGS[profile.stageChoice] || []);

      if (profile.x7 >= 0.5) {
        ["古代儀式", "禁忌", "異教", "伝承", "祭儀", "神話"].forEach((tag) => tags.add(tag));
      }
      if (profile.x8 >= 0.5) {
        ["禁書", "秘儀", "真実", "歴史", "記録", "断片"].forEach((tag) => tags.add(tag));
      }
      if (profile.x9 >= 0.5) {
        ["真実", "禁書", "歴史", "調査", "家系"].forEach((tag) => tags.add(tag));
      }
      if (profile.x5 >= 0.5) {
        ["夢", "幻想", "時間"].forEach((tag) => tags.add(tag));
      }
      if (profile.x10 >= 0.6) {
        ["神話", "歴史", "古代文明", "宇宙", "神"].forEach((tag) => tags.add(tag));
      }

      return [...tags];
    }

    function tagMatches(workMotif, expectedTag) {
      return workMotif.includes(expectedTag) || expectedTag.includes(workMotif);
    }

    function scoreTagMatch(work, expectedTags) {
      if (!expectedTags.length) return { score: 0.5, matched: [] };
      const matched = expectedTags.filter((tag) =>
        work.motifs.some((motif) => tagMatches(motif, tag))
      );
      return {
        score: matched.length / expectedTags.length,
        matched
      };
    }

    function calculatePenalty(work, profile) {
      let penalty = 1;

      if (work.U > profile.toleranceU + 0.45) {
        penalty *= 0.15;
      } else if (work.U > profile.toleranceU + 0.25) {
        penalty *= 0.4;
      }

      if (work.L > profile.toleranceL + 0.45) {
        penalty *= 0.2;
      } else if (work.L > profile.toleranceL + 0.25) {
        penalty *= 0.55;
      }

      if (work.R > profile.toleranceR + 0.45) {
        penalty *= 0.4;
      } else if (work.R > profile.toleranceR + 0.25) {
        penalty *= 0.7;
      }

      return penalty;
    }

    function buildReasons(work, profile, matchedTags, typeScore) {
      const reasons = [];

      const diffs = [
        { d: Math.abs(work.A - profile.targetA), text: "余韻の強さが希望に近い" },
        { d: Math.abs(work.D - profile.targetD), text: "読後の重さが狙いと一致" },
        { d: Math.abs(work.S - profile.targetS), text: "現実寄り／幻想寄りのバランスが合う" },
        { d: Math.abs(work.L - profile.targetL), text: "読み切りやすさ（長さ）が合う" },
        { d: Math.abs(work.U - profile.targetU), text: "不快度が許容範囲に収まりやすい" },
        { d: Math.abs(work.R - profile.targetR), text: "文章の難解さが好みに近い" }
      ];

      diffs
        .sort((a, b) => a.d - b.d)
        .slice(0, 2)
        .forEach((item) => reasons.push(item.text));

      if (typeScore >= 0.7) {
        reasons.push("物語タイプ（宇宙・狂気・禁術など）の相性が高い");
      }

      if (!reasons.length) reasons.push("総合スコアで上位一致");
      return reasons.slice(0, 3);
    }

    function evaluateWorks(profile) {
      const expectedTags = buildExpectedTags(profile);

      const scored = WORKS.map((work) => {
        const scoreNum = 1 - weightedMean([
          [Math.abs(work.A - profile.targetA), 0.18],
          [Math.abs(work.D - profile.targetD), 0.12],
          [Math.abs(work.U - profile.targetU), 0.1],
          [Math.abs(work.S - profile.targetS), 0.1],
          [Math.abs(work.L - profile.targetL), 0.12],
          [Math.abs(work.R - profile.targetR), 0.08]
        ]);

        const scoreType = cosineSimilarity(profile.typeVector, work.typeVector);
        const tagResult = scoreTagMatch(work, expectedTags);
        const penalty = calculatePenalty(work, profile);

        const baseScore = clamp01(0.55 * scoreNum + 0.3 * scoreType + 0.15 * tagResult.score);
        const finalScore = clamp01(baseScore * penalty);

        return {
          work,
          scoreNum,
          scoreType,
          scoreTag: tagResult.score,
          matchedTags: tagResult.matched,
          penalty,
          baseScore,
          finalScore,
          reasons: buildReasons(work, profile, tagResult.matched, scoreType)
        };
      });

      scored.sort((a, b) => b.finalScore - a.finalScore);
      return scored;
    }

    function pickAdventure(scored, alreadySelectedTitles, profile, topWork) {
      if (profile.x10 < 0.6) return null;

      const remaining = scored.filter((item) => !alreadySelectedTitles.has(item.work.title));
      const top = topWork || remaining[0];
      if (!remaining.length || !top) return null;

      const candidates = remaining
        .map((item) => {
          const novelty = weightedMean([
            [Math.abs(item.work.S - top.work.S), 0.35],
            [Math.abs(item.work.L - top.work.L), 0.35],
            [Math.abs(item.work.U - top.work.U), 0.3]
          ]);

          const worldPotential = weightedMean([
            [item.work.typeVector["宇宙"], 0.35],
            [item.work.typeVector["歴史"], 0.25],
            [item.work.A, 0.2],
            [item.work.L, 0.2]
          ]);

          return {
            ...item,
            adventureScore: item.finalScore * 0.72 + novelty * 0.18 + worldPotential * 0.1
          };
        })
        .filter((item) => item.finalScore > 0.28)
        .sort((a, b) => b.adventureScore - a.adventureScore);

      return candidates[0] || null;
    }

    function createElement(tagName, options = {}) {
      const element = document.createElement(tagName);
      if (options.className) element.className = options.className;
      if (options.text !== undefined) element.textContent = options.text;
      return element;
    }

    function createExternalLink(href, text, className) {
      const link = createElement("a", { className, text });
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      return link;
    }

    function createCard(item) {
      const scorePct = Math.round(item.finalScore * 100);
      const article = createElement("article", { className: "card" });
      const title = createElement("h4", { text: item.work.title });
      const meta = createElement("p", {
        className: "meta",
        text: `一致度: ${scorePct}% / ${item.work.length} / 難易度 ${item.work.difficulty}`
      });
      const reasons = createElement("ul", { className: "match" });

      item.reasons.forEach((reason) => {
        reasons.appendChild(createElement("li", { text: reason }));
      });

      article.append(title, meta, reasons, createExternalLink(item.work.url, "購入リンクを見る", "button primary"));
      return article;
    }

    function createSection(title, items) {
      const section = createElement("div", { className: "section" });
      const heading = createElement("h3", { text: title });
      const cards = createElement("div", { className: "cards" });

      items.forEach((item) => {
        cards.appendChild(createCard(item));
      });

      section.append(heading, cards);
      return section;
    }

    function renderResults(scored, profile, answers, options = {}) {
      const resultsEl = document.getElementById("results");
      const topPicks = scored.slice(0, 3);
      const runnerUps = scored.slice(3, 5);
      const selected = new Set([...topPicks, ...runnerUps].map((item) => item.work.title));
      const adventure = pickAdventure(scored, selected, profile, topPicks[0]);
      const shareUrl = buildResultUrl(answers);
      const shareLinks = buildShareLinks(topPicks[0], shareUrl);
      const shouldScroll = options.scroll !== false;
      const fragment = document.createDocumentFragment();
      const title = createElement("h2", { text: "診断結果" });
      const lead = createElement("p", {
        className: "lead",
        text: "入力した嗜好をもとに、スコア上位を抽出しました。"
      });
      const sharePanel = createElement("div", { className: "share-panel" });
      const shareSummary = createElement("p", {
        className: "share-summary",
        text: `本命は「${topPicks[0].work.title}」でした。結果専用URL付きで共有できます。`
      });
      const shareActions = createElement("div", { className: "share-actions" });
      const copyButton = createElement("button", {
        className: "button secondary",
        text: "URLをコピー"
      });

      copyButton.type = "button";
      shareActions.append(
        createExternalLink(shareLinks.x, "Xで共有", "button share-x"),
        createExternalLink(shareLinks.line, "LINEで共有", "button share-line"),
        createExternalLink(shareLinks.threads, "Threadsで共有", "button share-threads"),
        copyButton
      );
      sharePanel.append(shareSummary, shareActions);

      fragment.append(title, lead, sharePanel);
      fragment.appendChild(createSection("本命（条件一致が高い3本）", topPicks));
      fragment.appendChild(createSection("次点（近いが一部だけ違う2本）", runnerUps));

      if (adventure) {
        fragment.appendChild(createSection("冒険枠（新しい方向性の1本）", [adventure]));
      }

      fragment.appendChild(createElement("p", {
        className: "disclaimer",
        text: "※外部リンクは販売ページです。実際の版・収録作品はリンク先でご確認ください。"
      }));

      resultsEl.replaceChildren(fragment);

      replaceUrlSilently(shareUrl);
      resultsEl.style.display = "block";

      copyButton.addEventListener("click", async () => {
        const copied = await copyText(shareUrl);
        const originalLabel = "URLをコピー";
        copyButton.textContent = copied ? "URLをコピーしました" : "コピーできませんでした";
        window.setTimeout(() => {
          copyButton.textContent = originalLabel;
        }, 1800);
      });

      if (shouldScroll) {
        resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderQuestions() {
      const root = document.getElementById("question-list");
      const fragment = document.createDocumentFragment();

      QUESTIONS.forEach((q) => {
        const fieldset = createElement("fieldset", { className: "question" });
        const legend = createElement("legend", { className: "q-title", text: q.title });
        const options = createElement("div", { className: "options" });

        q.options.forEach((text, idx) => {
          const value = idx + 1;
          const label = createElement("label", { className: "option" });
          const input = createElement("input");
          const span = createElement("span", { text });

          input.type = "radio";
          input.name = q.id;
          input.value = String(value);
          label.append(input, span);
          options.appendChild(label);
        });

        fieldset.append(legend, options);
        fragment.appendChild(fieldset);
      });

      root.replaceChildren(fragment);
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.textContent = message;
      box.style.display = "block";
    }

    function clearError() {
      const box = document.getElementById("errorBox");
      box.textContent = "";
      box.style.display = "none";
    }

    function attachEvents() {
      const form = document.getElementById("quiz-form");
      const resetBtn = document.getElementById("resetBtn");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearError();

        const { error, answers } = collectAnswers();
        if (error) {
          showError(error);
          return;
        }

        const profile = buildUserProfile(answers);
        const scored = evaluateWorks(profile);
        renderResults(scored, profile, answers);
      });

      resetBtn.addEventListener("click", () => {
        form.reset();
        clearError();
        clearResultUrl();
        const resultsEl = document.getElementById("results");
        resultsEl.style.display = "none";
        resultsEl.replaceChildren();
      });
    }

    renderQuestions();
    attachEvents();

    const answersFromUrl = parseAnswersFromUrl();
    if (answersFromUrl) {
      applyAnswersToForm(answersFromUrl);
      const profileFromUrl = buildUserProfile(answersFromUrl);
      const scoredFromUrl = evaluateWorks(profileFromUrl);
      renderResults(scoredFromUrl, profileFromUrl, answersFromUrl, { scroll: false });
    }
  </script>
</body>
</html>
